<style>
/* Layout: sidebar navigasi kiri (jadi bar geser di HP) + area kerja; ringkasan di atas, detail di bawah. */
:root{
  --bg:#eff4f5; --surface:#ffffff; --surface2:#f5f9fa; --ink:#12242b; --muted:#5a7078; --line:#d9e3e6;
  --brand:#0b6e7f; --brand-soft:#d9eef2; --brand-ink:#ffffff; --heat:#e0602a; --heat-soft:#fbe6dc;
  --good:#1a8556; --good-soft:#dcf2e7; --warn:#a8730a; --warn-soft:#fbeccb; --bad:#c23636; --bad-soft:#f9e0e0;
  --shadow:0 1px 2px rgba(18,36,43,.06),0 4px 14px rgba(18,36,43,.05);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1f; --surface:#13262d; --surface2:#182f37; --ink:#e5f0f2; --muted:#8ea7af; --line:#25424c;
  --brand:#41c3d8; --brand-soft:#173a43; --brand-ink:#06242b; --heat:#ff8d5a; --heat-soft:#3a2418;
  --good:#4cc990; --good-soft:#15352a; --warn:#e8b64d; --warn-soft:#3a2f12; --bad:#ff7b7b; --bad-soft:#3d1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#13262d; --surface2:#182f37; --ink:#e5f0f2; --muted:#8ea7af; --line:#25424c;
  --brand:#41c3d8; --brand-soft:#173a43; --brand-ink:#06242b; --heat:#ff8d5a; --heat-soft:#3a2418;
  --good:#4cc990; --good-soft:#15352a; --warn:#e8b64d; --warn-soft:#3a2f12; --bad:#ff7b7b; --bad-soft:#3d1c1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px 48px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;line-height:1.1;display:block}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav svg{width:18px;height:18px;flex:none}
.sidefoot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head h1{font-size:26px;font-weight:800}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.del{color:var(--bad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:-.03em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-Baru{background:var(--brand-soft);color:var(--brand)}
.p-Dijadwalkan{background:var(--warn-soft);color:var(--warn)}
.p-Dikerjakan{background:var(--heat-soft);color:var(--heat)}
.p-Selesai,.p-Lunas,.p-Hadir,.p-Aman{background:var(--good-soft);color:var(--good)}
.p-Batal,.p-Alpa,.p-Terlambat{background:var(--bad-soft);color:var(--bad)}
.p-Belum,.p-Segera,.p-Izin,.p-Sakit,.p-Telat{background:var(--warn-soft);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.ok{background:var(--good)} .bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.info{background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.inv{background:#fff;color:#14232a;border-radius:10px;padding:24px;border:1px solid var(--line);max-width:720px}
.inv table{min-width:0}.inv th{background:#eef3f4;color:#4b6068}.inv td,.inv th{border-color:#d7e1e4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 40px}
  .side{position:static;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .sidefoot{display:none}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,filter .15s}}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const rpk=n=>{n=n||0;const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' jt':a>=1e3?Math.round(a/1e3)+' rb':a)};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,n)=>{const d=pd(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const TODAY=iso(new Date());
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fd=s=>{if(!s)return '-';const d=pd(s);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const fds=s=>{const d=pd(s);return d.getDate()+' '+BLN[d.getMonth()]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const KEY='awaljaya.v1';
const SERV={'Cuci AC':85000,'Tambah Freon':250000,'Perbaikan':350000,'Instalasi':450000,'Bongkar Pasang':400000};
const STAT=['Baru','Dijadwalkan','Dikerjakan','Selesai','Batal'];
const KAT_IN=['Jasa servis','Penjualan sparepart','Kontrak perawatan','Lainnya'];
const KAT_OUT=['Material & freon','Gaji karyawan','Bensin & transport','Sewa & listrik','Peralatan','Lainnya'];
let S=null, memOnly=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){memOnly=true}return null}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
  const r=rng(20261019), pick=a=>a[Math.floor(r()*a.length)];
  const emps=[{id:'e1',nama:'Budi Santoso',jabatan:'Teknisi',target:26},{id:'e2',nama:'Agus Prasetyo',jabatan:'Teknisi',target:26},{id:'e3',nama:'Dedi Kurniawan',jabatan:'Helper',target:18},{id:'e4',nama:'Rina Wulandari',jabatan:'Admin',target:0}];
  const cust=[['Ibu Sari','Perum Griya Asri B12'],['Pak Hendra','Jl. Melati No. 8'],['Toko Maju Jaya','Ruko Pasar Baru 3'],['Klinik Sehat','Jl. Veteran 45'],['Ibu Wati','Cluster Bukit Indah 7'],['Pak Rudi','Jl. Mawar 21'],['Kantor CV Abadi','Gedung Graha Lt.2'],['Bu Dewi','Perum Taman Sari C5'],['Pak Joko','Jl. Kenanga 14'],['Cafe Senja','Jl. Sudirman 102'],['Ibu Lina','Apartemen Skyline 12A'],['Pak Anton','Jl. Anggrek 9'],['Salon Cantika','Ruko Plaza 5'],['Bu Maya','Perum Citra Land D3'],['Pak Fajar','Jl. Pahlawan 30']].map((c,i)=>({nama:c[0],alamat:c[1],hp:'62812'+String(3400100+i*7311).slice(0,7)}));
  const orders=[],tx=[],inv=[];
  for(let i=0;i<64;i++){
    const age=Math.floor(r()*150), tgl=addD(TODAY,-age), c=pick(cust);
    const lay=r()<.5?'Cuci AC':pick(Object.keys(SERV)), unit=lay==='Cuci AC'?1+Math.floor(r()*4):1+Math.floor(r()*2);
    const tek=pick(['e1','e2']); let st='Selesai';
    if(age<3) st=pick(['Baru','Dijadwalkan','Dikerjakan']); else if(age<9&&r()<.25) st=pick(['Dijadwalkan','Dikerjakan']); else if(r()<.06) st='Batal';
    orders.push({id:'ORD-'+String(1000+i),tgl,nama:c.nama,hp:c.hp,alamat:c.alamat,layanan:lay,unit,nilai:SERV[lay]*unit,teknisi:tek,status:st});
  }
  orders.sort((a,b)=>a.tgl<b.tgl?-1:1);
  orders.filter(o=>o.status==='Selesai').forEach(o=>tx.push({id:uid('t'),tgl:o.tgl,jenis:'Pemasukan',kat:'Jasa servis',ket:o.layanan+' - '+o.nama,akun:r()<.6?'Bank':'Kas',jml:o.nilai,ref:o.id}));
  for(let m=0;m<6;m++){
    const base=addM(TODAY.slice(0,8)+'01',-m); const y=base.slice(0,7);
    if(addD(y+'-25',0)<=TODAY) tx.push({id:uid('t'),tgl:y+'-25',jenis:'Pengeluaran',kat:'Gaji karyawan',ket:'Gaji bulanan tim',akun:'Bank',jml:11400000,ref:''});
    tx.push({id:uid('t'),tgl:y+'-05',jenis:'Pengeluaran',kat:'Sewa & listrik',ket:'Sewa gudang & listrik',akun:'Bank',jml:1650000,ref:''});
    if(y+'-12'<=TODAY) tx.push({id:uid('t'),tgl:y+'-12',jenis:'Pengeluaran',kat:'Material & freon',ket:'Freon R32 & pipa',akun:'Kas',jml:1800000+Math.floor(r()*800000),ref:''});
    if(y+'-20'<=TODAY) tx.push({id:uid('t'),tgl:y+'-20',jenis:'Pengeluaran',kat:'Peralatan',ket:'Sparepart & alat',akun:'Kas',jml:350000+Math.floor(r()*400000),ref:''});
  }
  for(let w=0;w<20;w++){const t=addD(TODAY,-w*7-1);tx.push({id:uid('t'),tgl:t,jenis:'Pengeluaran',kat:'Bensin & transport',ket:'BBM motor operasional',akun:'Kas',jml:240000+Math.floor(r()*90000),ref:''})}
  const done=orders.filter(o=>o.status==='Selesai').slice(-6);
  done.forEach((o,i)=>inv.push({id:uid('i'),no:'INV-2610-'+pad(i+1),tgl:o.tgl,tempo:addD(o.tgl,7),nama:o.nama,hp:o.hp,alamat:o.alamat,items:[{desc:o.layanan,qty:o.unit,harga:SERV[o.layanan]}],diskon:0,status:i<3?'Lunas':'Belum',ref:o.id}));
  const att={};
  for(let d=0;d<35;d++){const t=addD(TODAY,-d);const wd=pd(t).getDay();if(wd===0)continue;att[t]={};
    emps.forEach(e=>{const x=r();if(d===0&&x>.6){return}
      if(x<.04)att[t][e.id]={s:'Sakit'};else if(x<.07)att[t][e.id]={s:'Izin'};else if(x<.09&&d>0)att[t][e.id]={s:'Alpa'};
      else{const mm=Math.floor(r()*28)-10;const h=8*60+mm;const inn=pad(Math.floor(h/60))+':'+pad(h%60);att[t][e.id]={s:'Hadir',in:inn,out:d===0?'':'17:'+pad(Math.floor(r()*30))}}})}
  return {demo:true,tab:'dash',set:{nama:'Awal Jaya Jaya',jamMasuk:'08:00',interval:3,lead:7,
    tpl:'Halo {nama}, ini {usaha}. AC di {alamat} terakhir dicuci {terakhir}. Sudah waktunya cuci rutin agar dingin & hemat listrik. Mau kami jadwalkan? Balas pesan ini ya.',
    bank:'BCA 000-000-0000 a.n. Awal Jaya Jaya',wa:'628100000000',targetOmzet:28000000,targetJob:60},
    orders,cust,emps,att,tx,inv,rem:{}};
}
function modal(html,onReady){const m=$('#modal');$('#sheet').style.width='';$('#sheet').innerHTML=html;m.hidden=false;onReady&&onReady($('#sheet'));const f=$('#sheet input,#sheet select,#sheet textarea');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML=''}
function fieldHTML(f,v){
  const val=v?.[f.k]??f.def??'';let inp;
  if(f.t==='select')inp=`<select id="f_${f.k}" name="${f.k}">${f.o.map(o=>{const ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;return `<option value="${esc(ov)}"${String(ov)===String(val)?' selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="f_${f.k}" name="${f.k}">${esc(val)}</textarea>`;
  else inp=`<input id="f_${f.k}" name="${f.k}" type="${f.t||'text'}" value="${esc(val)}"${f.req?' required':''}${f.min!=null?` min="${f.min}"`:''}${f.step?` step="${f.step}"`:''}>`;
  return `<label class="f" style="${f.wide?'grid-column:1/-1':''}">${esc(f.l)}${inp}</label>`;
}
function form(title,fields,vals,onSave,extra){
  modal(`<h2 style="font-size:20px">${esc(title)}</h2><form id="mf" class="grid" style="gap:14px"><div class="fgrid">${fields.map(f=>fieldHTML(f,vals)).join('')}</div>${extra||''}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div></form>`,sh=>{
    $('#mf',sh).addEventListener('submit',e=>{e.preventDefault();const o={};fields.forEach(f=>{let v=$('#f_'+f.k,sh).value;if(f.t==='number')v=Number(v)||0;o[f.k]=v});onSave(o);closeModal()});
  });
}
const A={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const f=A[b.dataset.act];if(f)f(b,e)}else if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
A.close=closeModal;
const ICON={
 dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
 keu:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
 wa:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.9A8 8 0 1 1 21 12z"/>',
 inv:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>',
 abs:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 kin:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 jur:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM9 9h6M9 13h6"/>'};
const TABS=[['dash','Dashboard Order'],['keu','Keuangan'],['wa','Reminder WA'],['inv','Invoice'],['abs','Absensi'],['kin','Kinerja'],['jur','Jurnal']];

<script>
const V={};
const CH={};
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CH[el.dataset.chg])CH[el.dataset.chg](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&CH[el.dataset.inp])CH[el.dataset.inp](el,e)});
const U={q:'',st:'Semua',per:'bulan',a:TODAY,b:TODAY,jq:'',jper:'bulan',invq:'',absM:TODAY.slice(0,7),kinM:TODAY.slice(0,7)};
function render(){

  hideLogin();ensureTab();

  $('#who').innerHTML=`<div><b>${esc(SES.nama)}</b><small>${ROLE_L[SES.role]}</small></div><button class="btn sm" data-act="logout">${DEMO_OPEN?'Ganti peran':'Keluar'}</button>`;
  if(SES.role!=='admin')$('#sidefoot').innerHTML='';

  if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}}

A.tab=b=>{S.tab=b.dataset.t;save();render();window.scrollTo(0,0)};
function setPer(k){U.per=k}

  const t=pd(TODAY),y=t.getFullYear(),m=t.getMonth();
  if(k==='hari')return[TODAY,TODAY];
  if(k==='7')return[addD(TODAY,-6),TODAY];
  if(k==='bulan')return[iso(new Date(y,m,1)),TODAY];
  if(k==='lalu')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
  if(k==='3bln')return[iso(new Date(y,m-2,1)),TODAY];
  if(k==='tahun')return[iso(new Date(y,0,1)),TODAY];
  return a<=b?[a,b]:[b,a];
}
const PERS=[['hari','Hari ini'],['7','7 hari'],['bulan','Bulan ini'],['lalu','Bulan lalu'],['3bln','3 bulan'],['tahun','Tahun ini'],['custom','Pilih tanggal']];

  return `<div class="row"><div class="tabs">${PERS.map(p=>`<button class="chip" aria-pressed="${x===p[0]}" data-act="per" data-k="${key}" data-v="${p[0]}">${p[1]}</button>`).join('')}</div>${x==='custom'?`<input id="${ak}" type="date" value="${U[ak]}" data-inp="perd" data-f="${ak}" style="width:auto"><span>s/d</span><input id="${bk}" type="date" value="${U[bk]}" data-inp="perd" data-f="${bk}" style="width:auto">`:''}</div>`;

CH.perd=el=>{U[el.dataset.f]=el.value;render()};
const ACT_ST=['Baru','Dijadwalkan','Dikerjakan'];

  <div class="tw" style="margin-top:12px"><table><thead><tr><th>No. order</th><th>Tanggal</th><th>Pelanggan</th><th>Layanan</th><th>Teknisi</th><th class="r">Nilai</th><th>Status</th><th>Nota</th><th></th></tr></thead><tbody>

  </tbody></table></div>${P.html}</div>`;
};
A.stf=b=>{U.st=b.dataset.v;render()};
CH.oq=el=>{U.q=el.value;render()};
CH.ost=el=>{const o=S.orders.find(x=>x.id===el.dataset.id);const ol=o.status;o.status=el.value;statusNotif(o,ol);save();render();toast(o.id+' jadi '+o.status)};
function orderForm(o){
  const nextId='ORD-'+(Math.max(1000,...S.orders.map(x=>Number(x.id.slice(4))||0))+1);
  const custOpts=[['','Pelanggan baru / ketik manual'],...S.cust.map(c=>[c.nama,c.nama])];
  const F=[{k:'tgl',l:'Tanggal',t:'date',req:1,def:TODAY},{k:'nama',l:'Nama pelanggan',req:1},{k:'hp',l:'No. WA (format 62812...)',def:''},{k:'alamat',l:'Alamat',wide:1},
   {k:'layanan',l:'Layanan',t:'select',o:Object.keys(SERV)},{k:'unit',l:'Jumlah unit AC',t:'number',min:1,def:1},{k:'nilai',l:'Nilai order (Rp)',t:'number',min:0,def:0},
   {k:'teknisi',l:'Teknisi',t:'select',o:S.emps.filter(e=>e.jabatan!=='Admin').map(e=>[e.id,e.nama])},{k:'status',l:'Status',t:'select',o:STAT.filter(s=>s!=='Batal'||(o&&o.status==='Batal')),def:'Baru'}];
  form(o?'Ubah order '+o.id:'Order baru',F,o,v=>{
    if(!v.nilai)v.nilai=(SERV[v.layanan]||0)*(v.unit||1);
    if(o)Object.assign(o,v);else S.orders.push({id:nextId,...v});
    if(!S.cust.find(c=>c.nama===v.nama))S.cust.push({nama:v.nama,hp:v.hp,alamat:v.alamat});

  });

A.editOrder=b=>orderForm(S.orders.find(x=>x.id===b.dataset.id));
A.delOrder=b=>{S.orders=S.orders.filter(x=>x.id!==b.dataset.id);save();render();toast('Order dihapus')};
function txIn(a,b){return S.tx.filter(t=>t.tgl>=a&&t.tgl<=b)}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(g){
  const W=720,H=250,L=48,R=8,T=12,B=28,pw=W-L-R,ph=H-T-B;
  const mx=niceMax(Math.max(...g.flatMap(x=>[x.a,x.b]),1)),n=g.length,bw=pw/n;
  const bar=Math.max(2,Math.min(22,bw*.36));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pemasukan dan pengeluaran">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${rpk(mx*i/4)}</text>`}
  const every=Math.ceil(n/12);
  g.forEach((x,i)=>{const cx=L+bw*i+bw/2,ha=ph*x.a/mx,hb=ph*x.b/mx;
    s+=`<rect x="${cx-bar-1}" y="${T+ph-ha}" width="${bar}" height="${ha}" rx="7" fill="var(--brand)"><title>${x.l}: masuk ${rp(x.a)}</title></rect><rect x="${cx+1}" y="${T+ph-hb}" width="${bar}" height="${hb}" rx="7" fill="var(--heat)"><title>${x.l}: keluar ${rp(x.b)}</title></rect>`;
    if(i%every===0)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${x.l}</text>`});
  return s+'</svg>';
}
function groupTx(a,b,list){
  const days=diffD(b,a)+1,out=[];
  if(days<=45){for(let i=0;i<days;i++){const d=addD(a,i);const t=list.filter(x=>x.tgl===d);out.push({l:fds(d),a:sum(t.filter(x=>x.jenis==='Pemasukan'),x=>x.jml),b:sum(t.filter(x=>x.jenis==='Pengeluaran'),x=>x.jml)})}}
  else{let d=pd(a);d=new Date(d.getFullYear(),d.getMonth(),1);const e=pd(b);while(d<=e){const k=iso(d).slice(0,7);const t=list.filter(x=>x.tgl.startsWith(k));out.push({l:BLN[d.getMonth()]+' '+String(d.getFullYear()).slice(2),a:sum(t.filter(x=>x.jenis==='Pemasukan'),x=>x.jml),b:sum(t.filter(x=>x.jenis==='Pengeluaran'),x=>x.jml)});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  return out;
}
function breakdown(list,jenis,color){
  const m={};list.filter(x=>x.jenis===jenis).forEach(x=>m[x.kat]=(m[x.kat]||0)+x.jml);
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=sum(e,x=>x[1]);
  return e.length?e.map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><span class="num">${rp(v)} <small style="color:var(--muted)">${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i style="width:${v/tot*100}%;background:${color}"></i></div></div>`).join(''):'<div class="empty">Belum ada data.</div>';
}
V.keu=()=>{
  const [a,b]=range(U.per,U.a,U.b),L=txIn(a,b);
  const m=sum(L.filter(x=>x.jenis==='Pemasukan'),x=>x.jml),k=sum(L.filter(x=>x.jenis==='Pengeluaran'),x=>x.jml),laba=m-k;
  const kas=sum(L.filter(x=>x.akun==='Kas'),x=>x.jenis==='Pemasukan'?x.jml:-x.jml),bank=sum(L.filter(x=>x.akun==='Bank'),x=>x.jenis==='Pemasukan'?x.jml:-x.jml);
  return `<div class="head"><div><h1>Keuangan</h1><p>${fd(a)}${a!==b?' sampai '+fd(b):''}</p></div><button class="btn pri" data-act="newTx">+ Catat transaksi</button></div>
  ${perBar('per','a','b')}
  <div class="grid g4">
   <div class="card kpi"><small>Pemasukan</small><span class="v" style="color:var(--good)">${rp(m)}</span><span class="s">${L.filter(x=>x.jenis==='Pemasukan').length} transaksi</span></div>
   <div class="card kpi"><small>Pengeluaran</small><span class="v" style="color:var(--heat)">${rp(k)}</span><span class="s">${L.filter(x=>x.jenis==='Pengeluaran').length} transaksi</span></div>
   <div class="card kpi"><small>Laba bersih</small><span class="v" style="color:${laba>=0?'var(--good)':'var(--bad)'}">${rp(laba)}</span><span class="s">margin ${m?Math.round(laba/m*100):0}%</span></div>
   <div class="card kpi"><small>Arus kas &amp; bank</small><span class="v" style="font-size:16px">Kas ${rp(kas)}</span><span class="s num">Bank ${rp(bank)}</span></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>Pemasukan vs pengeluaran</h3><div class="legend"><span><i style="background:var(--brand)"></i>Masuk</span><span><i style="background:var(--heat)"></i>Keluar</span></div></div>${barChart(groupTx(a,b,L))}</div>
  <div class="grid g2"><div class="card"><h3>Sumber pemasukan</h3>${breakdown(L,'Pemasukan','var(--brand)')}</div><div class="card"><h3>Rincian pengeluaran</h3>${breakdown(L,'Pengeluaran','var(--heat)')}</div></div>`;
};
function txForm(t){
  const F=[{k:'tgl',l:'Tanggal',t:'date',req:1,def:TODAY},{k:'jenis',l:'Jenis',t:'select',o:['Pemasukan','Pengeluaran'],def:'Pemasukan'},
   {k:'kat',l:'Kategori',t:'select',o:t&&t.jenis==='Pengeluaran'?KAT_OUT:KAT_IN,def:'Jasa servis'},{k:'akun',l:'Akun',t:'select',o:['Kas','Bank'],def:'Kas'},
   {k:'jml',l:'Jumlah (Rp)',t:'number',min:1,req:1},{k:'ket',l:'Keterangan',wide:1,req:1}];
  form(t?'Ubah transaksi':'Catat transaksi',F,t,v=>{if(t)Object.assign(t,v);else addTx(v);save();render();toast('Transaksi disimpan')});
  $('#f_jenis').addEventListener('change',e=>{const o=e.target.value==='Pemasukan'?KAT_IN:KAT_OUT;$('#f_kat').innerHTML=o.map(x=>`<option>${x}</option>`).join('')});
}
A.newTx=()=>txForm(null);
</script>
<script>
function remList(){
  const done=S.orders.filter(o=>o.layanan==='Cuci AC'&&o.status==='Selesai');
  const by={};done.forEach(o=>{if(!by[o.nama]||o.tgl>by[o.nama].tgl)by[o.nama]=o});
  return Object.values(by).map(o=>{
    const due=addM(o.tgl,S.set.interval),left=diffD(due,TODAY);
    const pending=S.orders.some(x=>x.nama===o.nama&&ACT_ST.includes(x.status)&&x.tgl>o.tgl);
    const st=pending?'Aman':left<0?'Terlambat':left<=S.set.lead?'Segera':'Aman';
    const sent=S.rem[o.nama];const sentNow=sent&&sent>=o.tgl?sent:null;
    return {nama:o.nama,hp:o.hp,alamat:o.alamat,last:o.tgl,due,left,st,pending,sent:sentNow};
  }).sort((a,b)=>a.left-b.left);
}
function remMsg(r){return S.set.tpl.replace(/\{nama\}/g,r.nama).replace(/\{usaha\}/g,S.set.nama).replace(/\{alamat\}/g,r.alamat).replace(/\{terakhir\}/g,fd(r.last)).replace(/\{jatuh_tempo\}/g,fd(r.due))}
const waLink=(hp,t)=>'https://wa.me/'+String(hp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(t);
V.wa=()=>{
  const all=remList(),need=all.filter(r=>r.st!=='Aman'&&!r.sent),f=U.wf||'perlu',rows=f==='perlu'?need:all;const P=paginate('w',rows,f);
  return `<div class="head"><div><h1>Reminder WA Cuci AC</h1><p>Pelanggan yang sudah waktunya cuci rutin, lengkap dengan pesan siap kirim.</p></div></div>
  <div class="grid g4">
   <div class="card kpi"><small>Perlu dihubungi</small><span class="v">${need.length}</span><span class="s">terlambat atau jatuh tempo ≤ ${S.set.lead} hari</span></div>
   <div class="card kpi"><small>Terlambat</small><span class="v" style="color:var(--bad)">${all.filter(r=>r.st==='Terlambat').length}</span><span class="s">lewat jatuh tempo</span></div>
   <div class="card kpi"><small>Sudah dikirimi</small><span class="v">${all.filter(r=>r.sent).length}</span><span class="s">pada siklus cuci terakhir</span></div>
   <div class="card kpi"><small>Total pelanggan cuci</small><span class="v">${all.length}</span><span class="s">pernah selesai cuci AC</span></div>
  </div>
  <div class="grid g2">
   <div class="card"><h3>Aturan pengingat</h3><div class="fgrid">
    <label class="f">Cuci ulang setiap (bulan)<input id="s_int" type="number" min="1" max="12" value="${S.set.interval}" data-chg="set" data-k="interval"></label>
    <label class="f">Ingatkan sebelum (hari)<input id="s_lead" type="number" min="0" max="60" value="${S.set.lead}" data-chg="set" data-k="lead"></label>
    <label class="f" style="grid-column:1/-1">Isi pesan<textarea id="s_tpl" data-chg="set" data-k="tpl">${esc(S.set.tpl)}</textarea></label></div>
    <p style="color:var(--muted);font-size:12px;margin:8px 0 0">Kata kunci: {nama} {usaha} {alamat} {terakhir} {jatuh_tempo}</p></div>
   <div class="card"><h3>Cara kerja</h3><div class="info">Daftar dan pesan dihitung otomatis dari order cuci AC yang berstatus Selesai. Tombol "Buka WhatsApp" membuka chat dengan pesan sudah terisi, tinggal kirim. Pengiriman tanpa klik butuh layanan WhatsApp Business API, yang tidak bisa dijalankan dari halaman ini.</div>
    ${all[0]?`<p style="margin:12px 0 4px;font-weight:600">Contoh pesan untuk ${esc(all[0].nama)}</p><div style="background:var(--surface2);border-radius:10px;padding:10px 12px;white-space:pre-wrap">${esc(remMsg(all[0]))}</div>`:''}</div>
  </div>
  <div class="card"><div class="tabs" style="margin-bottom:12px"><button class="chip" aria-pressed="${f==='perlu'}" data-act="wf" data-v="perlu">Perlu dihubungi (${need.length})</button><button class="chip" aria-pressed="${f==='semua'}" data-act="wf" data-v="semua">Semua pelanggan (${all.length})</button></div>
  <div class="tw"><table><thead><tr><th>Pelanggan</th><th>Terakhir cuci</th><th>Jatuh tempo</th><th>Status</th><th>Pesan</th><th></th></tr></thead><tbody>
  ${rows.length?P.items.map(r=>`<tr><td><b>${esc(r.nama)}</b><br><small class="num" style="color:var(--muted)">${esc(r.hp)}</small></td><td>${fd(r.last)}</td><td>${fd(r.due)}<br><small style="color:var(--muted)">${r.left<0?Math.abs(r.left)+' hari lewat':r.left+' hari lagi'}</small></td>
  <td><span class="pill p-${r.st}">${r.pending?'Sudah dijadwalkan':r.st}</span></td><td>${r.sent?'<span class="pill p-Lunas">Ditandai terkirim '+fds(r.sent)+'</span>':'<small style="color:var(--muted)">Belum dikirim</small>'}</td>
  <td class="r"><div class="row" style="justify-content:flex-end"><a class="btn sm pri" href="${waLink(r.hp,remMsg(r))}" target="_blank" rel="noopener">Buka WhatsApp</a><button class="btn sm" data-act="remCopy" data-n="${esc(r.nama)}">Salin</button><button class="btn sm" data-act="remMark" data-n="${esc(r.nama)}">Tandai terkirim</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Tidak ada pelanggan yang perlu dihubungi hari ini.</td></tr>'}
  </tbody></table></div>${P.html}</div>`;
};
A.wf=b=>{U.wf=b.dataset.v;render()};
CH.set=el=>{const k=el.dataset.k;S.set[k]=el.type==='number'?Math.max(0,Number(el.value)||0):el.value;save();render()};
function copyText(t){return navigator.clipboard.writeText(t).then(()=>toast('Tersalin')).catch(()=>toast('Browser menolak menyalin, salin manual dari kotak pesan'))}
A.remCopy=b=>{const r=remList().find(x=>x.nama===b.dataset.n);if(r)copyText(remMsg(r))};
A.remMark=b=>{S.rem[b.dataset.n]=TODAY;save();render();toast('Ditandai sudah dikirim')};
const invTot=i=>{const s=sum(i.items,x=>x.qty*x.harga);return{sub:s,tot:Math.max(0,s-(i.diskon||0))}};
const invStat=i=>i.appr==='Menunggu'?'Menunggu':i.appr==='Ditolak'?'Ditolak':i.status==='Lunas'?'Lunas':i.tempo<TODAY?'Telat':'Belum';
V.inv=()=>{
  const q=U.invq.toLowerCase(),L=[...S.inv].sort((a,b)=>a.tgl<b.tgl?1:-1).filter(i=>!q||(i.no+i.nama).toLowerCase().includes(q));
  const open=S.inv.filter(i=>i.status!=='Lunas'&&(!i.appr||i.appr==='Disetujui'));const P=paginate('i',L,U.invq);
  return `<div class="head"><div><h1>Invoice</h1><p>Buat tagihan, kirim ke pelanggan, tandai lunas.</p></div><button class="btn pri" data-act="newInv">+ Invoice baru</button></div>
  <div class="grid g4"><div class="card kpi"><small>Belum dibayar</small><span class="v">${rp(sum(open,i=>invTot(i).tot))}</span><span class="s">${open.length} invoice</span></div>
  <div class="card kpi"><small>Telat bayar</small><span class="v" style="color:var(--bad)">${open.filter(i=>i.tempo<TODAY).length}</span><span class="s">lewat jatuh tempo</span></div>
  <div class="card kpi"><small>Lunas bulan ini</small><span class="v">${rp(sum(S.inv.filter(i=>i.status==='Lunas'&&i.tgl.startsWith(TODAY.slice(0,7))),i=>invTot(i).tot))}</span><span class="s">dari invoice bulan ini</span></div></div>
  <div class="card"><input id="iq" placeholder="Cari no. invoice atau pelanggan" value="${esc(U.invq)}" data-inp="iq" style="max-width:300px;margin-bottom:12px"><div class="tw"><table><thead><tr><th>No.</th><th>Tanggal</th><th>Pelanggan</th><th>Jatuh tempo</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${L.length?P.items.map(i=>`<tr><td class="num">${i.no}</td><td>${fds(i.tgl)}</td><td>${esc(i.nama)}</td><td>${fds(i.tempo)}</td><td class="r num">${rp(invTot(i).tot)}</td><td><span class="pill p-${invStat(i)}">${invStat(i)}</span></td><td class="r"><button class="btn sm" data-act="viewInv" data-id="${i.id}">Buka</button> <button class="btn sm del" data-act="delInv" data-id="${i.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada invoice. Klik "Invoice baru".</td></tr>'}</tbody></table></div>${P.html}</div>`;
};
CH.iq=el=>{U.invq=el.value;render()};
A.delInv=b=>{S.inv=S.inv.filter(i=>i.id!==b.dataset.id);save();render();toast('Invoice dihapus')};
function itemRow(x){return `<tr><td><input data-r="desc" value="${esc(x.desc)}" placeholder="Deskripsi"></td><td style="width:70px"><input data-r="qty" type="number" min="1" value="${x.qty}"></td><td style="width:130px"><input data-r="harga" type="number" min="0" value="${x.harga}"></td><td style="width:44px"><button type="button" class="btn sm del" data-act="rmRow" aria-label="Hapus baris">×</button></td></tr>`}
A.rmRow=b=>{const tb=b.closest('tbody');if(tb.rows.length>1){b.closest('tr').remove();invCalc()}};
A.addRow=()=>{$('#ibody').insertAdjacentHTML('beforeend',itemRow({desc:'',qty:1,harga:0}))};
function invCalc(){const s=$$('#ibody tr').reduce((t,r)=>t+(Number($('[data-r=qty]',r).value)||0)*(Number($('[data-r=harga]',r).value)||0),0);$('#itot').textContent=rp(Math.max(0,s-(Number($('#f_diskon').value)||0)))}
A.newInv=()=>{
  const nxt='INV-'+TODAY.slice(2,4)+TODAY.slice(5,7)+'-'+pad(S.inv.filter(i=>i.no.startsWith('INV-'+TODAY.slice(2,4)+TODAY.slice(5,7))).length+1);
  const oo=S.orders.filter(o=>o.status==='Selesai').sort((a,b)=>a.tgl<b.tgl?1:-1).slice(0,25);
  modal(`<h2 style="font-size:20px">Invoice baru ${nxt}</h2><form id="mf" class="grid" style="gap:14px">
  <label class="f">Isi dari order selesai<select id="f_ord"><option value="">Isi manual</option>${oo.map(o=>`<option value="${o.id}">${o.id} - ${esc(o.nama)} (${fds(o.tgl)})</option>`).join('')}</select></label>
  <div class="fgrid"><label class="f">Nama pelanggan<input id="f_nama" required list="dl_c"></label><datalist id="dl_c">${S.cust.map(c=>`<option value="${esc(c.nama)}">`).join('')}</datalist>
  <label class="f">No. WA<input id="f_hp"></label><label class="f" style="grid-column:1/-1">Alamat<input id="f_alamat"></label>
  <label class="f">Tanggal<input id="f_tgl" type="date" value="${TODAY}"></label><label class="f">Jatuh tempo<input id="f_tempo" type="date" value="${addD(TODAY,7)}"></label></div>
  <div class="tw"><table style="min-width:0"><thead><tr><th>Item</th><th>Qty</th><th>Harga</th><th></th></tr></thead><tbody id="ibody">${itemRow({desc:'Cuci AC',qty:1,harga:SERV['Cuci AC']})}</tbody></table></div>
  <div class="row" style="justify-content:space-between"><button type="button" class="btn sm" data-act="addRow">+ Tambah baris</button><label class="f" style="flex-direction:row;align-items:center;gap:8px">Diskon (Rp)<input id="f_diskon" type="number" min="0" value="0" style="width:120px"></label></div>
  <div class="row" style="justify-content:space-between"><b>Total</b><b class="num" id="itot" style="font-size:20px"></b></div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri" type="submit">Simpan invoice</button></div></form>`,sh=>{
    invCalc();

    $('#f_nama',sh).addEventListener('change',e=>{const c=S.cust.find(x=>x.nama===e.target.value);if(c){$('#f_hp',sh).value=c.hp||'';$('#f_alamat',sh).value=c.alamat||''}});

      save();closeModal();render();toast('Invoice '+nxt+' dibuat');
    });
  });
};
function invHTML(i){const t=invTot(i);
  return `<div class="inv"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:22px">${esc(S.set.nama)}</h2><div style="color:#4b6068">Servis, cuci &amp; instalasi AC</div></div><div style="text-align:right"><b style="font-size:18px;letter-spacing:.08em">INVOICE</b><div class="num">${i.no}</div></div></div>

async function saveFile(name,data){try{if(typeof claude==='undefined'){const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('File diunduh');return}const d=await claude.use('downloads');if(!d){toast('Unduh tidak tersedia di tampilan ini');return}await d.save({filename:name,data});toast('File siap disimpan')}catch(e){if(e&&e.code!=='declined')toast('Unduh gagal atau tidak tersedia')}}

<script>

  else if(u===L.role&&ak[L.role]===p)ses={role:L.role,nama:({admin:'Admin Super',direktur:'Direktur',adminjual:'Admin Penjualan',adminops:'Admin Operasional'})[L.role]};

function paginate(k,rows,sig){
  if(U.pgs[k]!==sig){U.pgs[k]=sig;U.pg[k]=1}
  const n=rows.length,pages=Math.max(1,Math.ceil(n/PAGE)),p=Math.min(U.pg[k]||1,pages);U.pg[k]=p;const a=(p-1)*PAGE;
  let html='';
  if(n>PAGE){const nums=[];for(let i=Math.max(1,p-2);i<=Math.min(pages,p+2);i++)nums.push(i);
    html=`<div class="pager"><span>Menampilkan ${a+1}-${Math.min(n,a+PAGE)} dari ${n}</span><div class="row"><button class="btn sm" data-act="pg" data-k="${k}" data-p="${p-1}"${p<2?' disabled':''}>Sebelumnya</button>${nums.map(i=>`<button class="btn sm${i===p?' cur':''}" data-act="pg" data-k="${k}" data-p="${i}"${i===p?' aria-current="page"':''}>${i}</button>`).join('')}<button class="btn sm" data-act="pg" data-k="${k}" data-p="${p+1}"${p>=pages?' disabled':''}>Berikutnya</button></div></div>`}
  else if(n)html=`<div class="pager"><span>${n} data</span></div>`;
  return{items:rows.slice(a,a+PAGE),html};
}

  <div class="row">${o.hp?`<a class="btn sm" href="tel:+${String(o.hp).replace(/\D/g,'')}">Telepon</a><a class="btn sm" href="${waLink(o.hp,'Halo '+o.nama+', kami teknisi '+S.set.nama+'.')}" target="_blank" rel="noopener">WhatsApp</a>`:''}<a class="btn sm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.alamat)}" target="_blank" rel="noopener">Peta</a>${NEXT[o.status]?`<button class="btn sm pri" data-act="tNext" data-id="${o.id}">${NEXT[o.status][1]}</button>`:''}</div></div>`).join(''):'<div class="card empty">Tidak ada order di filter ini.</div>'}</div>${P.html}`;
};

V.absT=()=>{

<script>
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const isLate=t=>t&&t>S.set.jamMasuk;
V.abs=()=>{
  const day=S.att[TODAY]||{},E=S.emps;
  const hadir=E.filter(e=>day[e.id]&&day[e.id].s==='Hadir').length;
  const [y,m]=U.absM.split('-').map(Number),days=new Date(y,m,0).getDate();

    if(a.s==='Hadir'){h++;if(isLate(a.in))tl++}else if(a.s==='Izin')iz++;else if(a.s==='Sakit')sk++;else al++});

  <td class="r"><div class="row" style="justify-content:flex-end">${!a?`<button class="btn sm pri" data-act="clockIn" data-id="${e.id}">Absen masuk</button><select data-chg="absS" data-id="${e.id}" style="width:auto;padding:4px 8px"><option value="">Izin / sakit...</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select>`:a.s==='Hadir'&&!a.out?`<button class="btn sm" data-act="clockOut" data-id="${e.id}">Absen pulang</button>`:''}${a?`<button class="btn sm del" data-act="resetAbs" data-id="${e.id}">Reset</button>`:''}</div></td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>Rekap bulanan</h3><input id="absm" type="month" value="${U.absM}" data-inp="absM" style="width:auto"></div>

  ${rec.map(r=>`<tr><td>${esc(r.e.nama)}</td><td class="r num">${ds.length}</td><td class="r num">${r.h}</td><td class="r num">${r.tl}</td><td class="r num">${r.iz}</td><td class="r num">${r.sk}</td><td class="r num">${r.al}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i class="${r.pct>=90?'ok':r.pct>=75?'mid':'low'}" style="width:${r.pct}%"></i></div><span class="num">${r.pct}%</span></div></td></tr>`).join('')}</tbody></table></div>
  <p style="color:var(--muted);margin:8px 0 0;font-size:12px">Hari kerja dihitung Senin sampai Sabtu. Hari yang belum diisi dianggap alpa.</p></div>`;
};
CH.absM=el=>{if(el.value){U.absM=el.value;render()}};
A.clockIn=b=>{(S.att[TODAY]=S.att[TODAY]||{})[b.dataset.id]={s:'Hadir',in:nowHM(),out:''};save();render();toast('Absen masuk '+nowHM())};

   <div class="card kpi"><small>Laba bersih</small><span class="v" style="color:${rev-exp>=0?'var(--good)':'var(--bad)'}">${rp(rev-exp)}</span><span class="s">margin ${pct(rev-exp,rev)}%</span></div>
   <div class="card kpi"><small>Tingkat penyelesaian</small><span class="v">${pct(O.length,all.length)}%</span><span class="s">${O.length} selesai dari ${all.length} order bulan ini</span></div>
  </div>
  <div class="card"><h3>Pencapaian karyawan</h3><div class="tw"><table><thead><tr><th>Karyawan</th><th class="r">Order selesai</th><th class="r">Target</th><th style="min-width:150px">Capaian</th><th class="r">Nilai dikerjakan</th><th class="r">Kehadiran</th></tr></thead><tbody>
  ${emp.length?emp.map((r,i)=>`<tr><td><b>${esc(r.e.nama)}</b>${i===0&&r.n?' <span class="pill p-Selesai">Terbaik</span>':''}<br><small style="color:var(--muted)">${esc(r.e.jabatan)}</small></td><td class="r num">${r.n}</td><td class="r num">${r.e.target}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i class="${barCls(r.pc)}" style="width:${Math.min(100,r.pc)}%"></i></div><span class="num">${r.pc}%</span></div></td><td class="r num">${rp(r.v)}</td><td class="r num">${r.att}%</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada teknisi.</td></tr>'}</tbody></table></div>
  <p style="color:var(--muted);margin:8px 0 0;font-size:12px">Capaian dihitung dari order berstatus Selesai yang ditugaskan ke karyawan itu.</p></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>Tren 6 bulan perusahaan</h3><div class="legend"><span><i style="background:var(--brand)"></i>Masuk</span><span><i style="background:var(--heat)"></i>Keluar</span></div></div>${barChart(trend)}</div>`;
};

function jurRows(L){const rows=[];

  ${R.length?P.items.map(r=>`<tr><td>${fds(r.t.tgl)}</td><td>${esc(r.t.ket)}</td><td class="num"><small>${esc(r.t.ref)}</small></td><td>${esc(r.d)}</td><td style="padding-left:24px">${esc(r.k)}</td><td class="r num">${rp(r.t.jml)}</td><td class="r num">${rp(r.t.jml)}</td><td class="r"><button class="btn sm" data-act="editTx" data-id="${r.t.id}">Ubah</button> <button class="btn sm del" data-act="delTx" data-id="${r.t.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada transaksi di periode ini.</td></tr>'}
  </tbody><tfoot><tr><td colspan="5"><b>Total ${R.length} entri</b></td><td class="r num"><b>${rp(tot)}</b></td><td class="r num"><b>${rp(tot)}</b></td><td></td></tr></tfoot></table></div>${P.html}</div>`;

<script>
/* ---------- Pemberitahuan (lonceng) per peran ---------- */
const NKEEP=150;
const NI={
 wait:{c:'warn',p:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
 ok:{c:'good',p:'<path d="M5 12l4 4L19 7"/>'},
 no:{c:'bad',p:'<path d="M6 6l12 12M18 6L6 18"/>'},
 job:{c:'brand',p:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'},
 stok:{c:'heat',p:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>'},
 info:{c:'brand',p:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'}};
const nKey=()=>SES.role==='teknisi'?'t'+SES.empId:SES.role;
const rdOf=n=>n.rd||(n.rd={});
const nVis=n=>{if(!SES)return false;if(SES.role==='admin')return true;if(!(n.roles||[]).includes(SES.role))return false;return SES.role!=='teknisi'||n.emp===SES.empId};
const nList=()=>(S&&S.notif||[]).filter(nVis);
const nUnread=()=>{const k=nKey();return nList().filter(n=>!rdOf(n)[k])};
function notify(roles,judul,teks,o){o=o||{};S.notif=S.notif||[];
 S.notif.unshift({id:uid('n'),ts:Date.now(),roles:[].concat(roles),emp:o.emp||null,judul,teks:teks||'',tipe:o.tipe||'info',tab:o.tab||'',jobF:o.jobF||'',rd:{}});
 if(S.notif.length>NKEEP)S.notif.length=NKEEP}
function nAgo(ts){const m=Math.floor((Date.now()-ts)/6e4);if(m<1)return 'baru saja';if(m<60)return m+' mnt lalu';const h=Math.floor(m/60);if(h<24)return h+' jam lalu';const d=new Date(ts);return fds(iso(d))+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function bellHTML(){const n=SES?nUnread().length:0,p=$('#np'),open=!!p&&!p.hidden;
 return `<button type="button" class="bell" data-act="npToggle" aria-haspopup="dialog" aria-expanded="${open}" aria-label="Pemberitahuan${n?', '+n+' belum dibaca':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>${n?`<span class="bdg">${n>99?'99+':n}</span>`:''}</button>`}
function npRender(){const p=$('#np');if(!p||p.hidden||!SES)return;
 const L=nList(),k=nKey(),f=U.npf||'all',un=L.filter(n=>!rdOf(n)[k]),rows=(f==='un'?un:L).slice(0,40);
 p.innerHTML=`<div class="np-h"><b>Pemberitahuan</b><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn sm" data-act="npAll"${un.length?'':' disabled'}>Tandai semua dibaca</button><button type="button" class="btn sm" data-act="npClose" aria-label="Tutup">×</button></div></div>
 <div class="np-t"><button type="button" class="chip" aria-pressed="${f==='all'}" data-act="npF" data-v="all">Semua (${L.length})</button><button type="button" class="chip" aria-pressed="${f==='un'}" data-act="npF" data-v="un">Belum dibaca (${un.length})</button></div>
 <div class="np-l">${rows.length?rows.map(n=>{const t=NI[n.tipe]||NI.info,u=!rdOf(n)[k];
  return `<button type="button" class="ni${u?' un':''}" data-act="npGo" data-id="${n.id}"><span class="ic" style="background:var(--${t.c}-soft);color:var(--${t.c})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.p}</svg></span><span style="flex:1;min-width:0"><b>${esc(n.judul)}</b><span class="tx">${esc(n.teks)}</span><time>${nAgo(n.ts)}</time></span>${u?'<i class="dot" aria-label="Belum dibaca"></i>':''}</button>`}).join(''):`<div class="empty">${f==='un'?'Semua sudah dibaca.':'Belum ada pemberitahuan. Pengajuan, persetujuan, job, dan perubahan status akan muncul di sini sesuai peran Anda.'}</div>`}</div>`}
function npClose(){const p=$('#np');if(p)p.hidden=true;$$('.bell').forEach(b=>b.setAttribute('aria-expanded','false'))}
A.npToggle=()=>{const p=$('#np');if(!p)return;p.hidden=!p.hidden;if(!p.hidden)npRender();$$('.bell').forEach(b=>b.setAttribute('aria-expanded',String(!p.hidden)))};
A.npClose=npClose;
A.npF=b=>{U.npf=b.dataset.v;npRender()};
A.npAll=()=>{const k=nKey();nList().forEach(n=>rdOf(n)[k]=1);save();render()};
A.npGo=b=>{const n=(S.notif||[]).find(x=>x.id===b.dataset.id);if(!n)return;rdOf(n)[nKey()]=1;let go=false;
 if(n.tab&&allowedTabs().some(t=>t[0]===n.tab)){S.tab=n.tab;if(n.jobF&&n.tab==='job')U.jobF=n.jobF;go=true}
 save();npClose();render();if(go)window.scrollTo(0,0)};
document.addEventListener('click',e=>{const p=$('#np');if(!p||p.hidden)return;if(e.target.closest('#np')||e.target.closest('.bell'))return;npClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=$('#np');if(p&&!p.hidden)npClose()}});
const _r0=render;render=function(){_r0();const bb=$('#bellbox');if(bb)bb.innerHTML=SES?bellHTML():'';if(!SES)npClose();else npRender()};
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue||!SES||!$('#modal').hidden)return;
 try{const b=nUnread().length;S=JSON.parse(e.newValue);mig();const a=nUnread().length;render();if(a>b)toast('Ada '+(a-b)+' pemberitahuan baru')}catch(_){}});

/* ---------- Pemicu pemberitahuan ---------- */
function reqNotif(jenis,ket,jml,alasan){const j=RJ[jenis]||jenis;
 notify(['direktur'],j+' menunggu persetujuan',ket+' · '+rp(jml)+' · diajukan oleh '+SES.nama+(alasan?' · Alasan: '+alasan:''),{tipe:'wait',tab:'apr'});
 notify([SES.role],'Menunggu persetujuan Direktur',j+': '+ket+' · '+rp(jml),{tipe:'wait',tab:/inv/i.test(jenis)?'inv':'jur'})}
function decNotif(r,ok,al){const j=RJ[r.jenis]||r.jenis;
 notify(r.role?[r.role]:['adminjual','adminops'],j+(ok?' disetujui':' ditolak'),r.ket+' · '+rp(r.jml)+' · oleh '+SES.nama+(ok?'':' · Alasan: '+al),{tipe:ok?'ok':'no',tab:/inv/i.test(r.jenis)?'inv':'jur'})}
function lowNotif(s,b4){if((b4>s.min&&s.qty<=s.min)||(b4>0&&s.qty<=0))notify(['direktur'],s.qty<=0?'Stok habis':'Stok menipis',s.nama+': sisa '+s.qty+' '+s.sat+' (minimum '+s.min+')',{tipe:'stok',tab:'stk'})}
function jobNotif(o,baru,prevT){const info=o.id+' · '+o.nama+' · '+o.layanan+' ×'+o.unit;
 if(baru)notify(['adminjual','adminops'],o.teknisi?'Job baru dibuat dan ditugaskan':'Job baru belum dibagi',info+(o.teknisi?'':' · pilih teknisi di Pembagian Job'),{tipe:'job',tab:'job',jobF:o.teknisi?'aktif':'belum'});
 if(o.teknisi&&o.teknisi!==prevT)notify(['teknisi'],'Job baru untuk Anda',info+' · '+fds(o.tgl)+(o.jam?' '+o.jam:'')+' · '+o.alamat,{emp:o.teknisi,tipe:'job',tab:'dash'});
 if(prevT&&o.teknisi!==prevT)notify(['teknisi'],o.teknisi?'Job dialihkan ke teknisi lain':'Penugasan job dibatalkan',info,{emp:prevT,tipe:'info',tab:'dash'})}
function statusNotif(o,old){if(!SES||old===o.status)return;
 const T=SES.role==='teknisi',adm=['adminjual','adminops'],info=o.id+' · '+o.nama+' · '+o.layanan,
 ST={Baru:'dikembalikan ke status Baru',Dijadwalkan:'diterima dan dijadwalkan',Dikerjakan:'mulai dikerjakan',Selesai:'selesai dikerjakan',Batal:'dibatalkan'},
 msg=info+' · '+(ST[o.status]||o.status)+' oleh '+SES.nama;
 if(o.status==='Batal'){const m=msg+(o.alasanBatal?' · Alasan: '+o.alasanBatal:'');
  notify(adm,'Order dibatalkan',m,{tipe:'no',tab:'job',jobF:'all'});
  if(o.teknisi&&!T)notify(['teknisi'],'Order dibatalkan',m,{emp:o.teknisi,tipe:'no',tab:'dash'});return}
 if(o.status==='Selesai')notify(adm,'Order selesai, belum ditagih',info+' · selesai oleh '+SES.nama+' · '+rp(o.nilai)+' siap dibuatkan nota di Kasir',{tipe:'wait',tab:'job',jobF:'tagih'});
 else if(T)notify(adm,'Status order: '+o.status,msg,{tipe:'job',tab:'job',jobF:'aktif'});
 if(!T&&o.teknisi)notify(['teknisi'],'Status order diubah: '+o.status,msg,{emp:o.teknisi,tipe:'info',tab:'dash'})}
</script>
<script>
const isAp=()=>!!SES&&SES.role==='direktur',isSA=()=>!!SES&&SES.role==='admin',canJur=()=>!!SES&&(SES.role==='admin'||SES.role==='adminops'),isAdm=()=>!!SES&&(SES.role==='adminjual'||SES.role==='adminops');
const okInv=i=>!i.appr||i.appr==='Disetujui';
const OKTX=()=>S.tx.filter(t=>!t.appr||t.appr==='Disetujui');
function txIn(a,b){return OKTX().filter(t=>t.tgl>=a&&t.tgl<=b)}
const TABS2=[['dash','Dashboard Order'],['job','Pembagian Job'],['kas','Kasir'],['keu','Keuangan'],['ana','Analisa Penjualan'],['wa','Reminder WA'],['inv','Invoice'],['apr','Persetujuan'],['abs','Absensi'],['kin','Kinerja'],['stk','Stok Material'],['sup','Pemasok'],['srt','Surat Masuk/Keluar'],['sewa','Monitoring Sewa AC'],['jur','Jurnal']];
TABS.length=0;TABS.push(...TABS2);
const ci='<circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/>';
Object.assign(ICON,{job:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',sewa:'<path d="M3 7h18v8H3zM7 19v-4M17 19v-4M7 11h4M15 11h2"/>',kas:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',ana:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',apr:'<path d="M5 12l4 4L19 7"/>',stk:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',sup:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/>',srt:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'});
const EMO={dash:'📋',kas:'🛒',keu:'💸',ana:'📈',wa:'💬',inv:'🧾',apr:'✅',abs:'📍',kin:'🏆',stk:'📦',sup:'🚚',srt:'✉️',jur:'📒'};
const nPend=()=>S.req.filter(r=>r.st==='Menunggu').length;
function allowedTabs(){const r=SES.role;if(r==='teknisi')return[['dash','Order Saya'],['abs','Absensi']];
  const ok={admin:TABS2.map(t=>t[0]).filter(x=>x!=='apr'),direktur:['ana','keu','inv','apr','kin','stk','sup'],adminjual:['dash','job','kas','wa','inv','abs'],adminops:['dash','job','kas','wa','inv','abs','sup','srt','sewa','jur']}[r]||['dash'];
  return TABS2.filter(t=>ok.includes(t[0])).map(t=>t[0]==='apr'&&nPend()?[t[0],t[1]+' ('+nPend()+')']:t)}

V.sewa=()=>{const A0=S.sewa.filter(r=>r.status!=='Selesai'),on=S.sewa.filter(r=>r.status==='Terpasang'),K4=(t,v,s,c)=>`<div class="card kpi"><small>${t}</small><span class="v"${c?` style="color:${c}"`:''}>${v}</span><span class="s">${s}</span></div>`;
 return crud('sewa',`<div class="grid g4">${K4('Sewa berjalan',on.length,'unit terpasang di pelanggan')}${K4('Segera berakhir',A0.filter(r=>swD(r)>=0&&swD(r)<=7).length,'dalam 7 hari','var(--heat)')}${K4('Lewat tempo',A0.filter(r=>swD(r)<0).length,'perlu ditindak','var(--bad)')}${K4('Pendapatan sewa',rp(sum(on,r=>r.tarif*r.qty)),'per bulan, sewa berjalan')}</div>`)};

A.tMat=b=>{const o=S.orders.find(x=>x.id===b.dataset.id&&x.teknisi===SES.empId);if(o&&o.status==='Dikerjakan')finishOrder(o,1)};
const _dT=V.dashT;V.dashT=()=>_dT().replace(/<button[^>]*data-act="tNext"[^>]*>/g,m=>{const id=(m.match(/data-id="([^"]+)"/)||[])[1],o=S.orders.find(x=>x.id===id);return(o&&o.status==='Dikerjakan'?`<button class="btn sm" data-act="tMat" data-id="${id}">Catat material</button>`:'')+m});

function loadJob(id){const o=S.orders.find(x=>x.id===id);if(!o)return;const c=S.cust.find(x=>x.nama===o.nama)||{},u=o.unit||1,L=[{k:'J:'+o.layanan,desc:o.layanan,qty:u,harga:Math.round(o.nilai/u)}];
 (o.pakai||[]).forEach(p=>{const s=S.stok.find(x=>x.id===p.sid);if(s)L.push({k:'B:'+s.id,desc:s.nama+' (dipakai teknisi)',qty:p.qty,harga:s.harga,nd:1})});
 K=Object.assign(newK(),{job:id,cno:c.no||'',nama:o.nama,hp:o.hp||c.hp||'',alamat:o.alamat||'',tek:o.teknisi||'',found:!!c.no,lines:L});render()}
CH.kJob=el=>{if(el.value)loadJob(el.value)};A.kUnlink=()=>{K=newK();render()};

/* ---------- Nota / tagihan per order ---------- */
const notaOf=o=>S.inv.find(i=>i.ref===o.id&&i.appr!=='Ditolak');
const tagihN=()=>S.orders.filter(o=>o.status==='Selesai'&&!notaOf(o));
const canKas=()=>!!SES&&['admin','adminjual','adminops'].includes(SES.role);
const notaCell=o=>{const i=notaOf(o);if(i)return `<span class="pill p-${invStat(i)}">${i.no}</span><br><small>${invStat(i)==='Menunggu'?'menunggu persetujuan':invStat(i)}</small>`;
 if(o.status==='Selesai')return `<span class="pill p-Belum">Belum ada nota</span>${canKas()?`<br><button class="btn sm pri" data-act="mkNota" data-id="${o.id}" style="margin-top:4px">Buat tagihan</button>`:''}`;
 return o.status==='Batal'?'-':'<small style="color:var(--muted)">Belum selesai</small>'};
const tagihBanner=()=>{const L=tagihN();if(!L.length||!canKas())return '';return `<div class="info" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><span><b>${L.length} order selesai</b> belum dibuatkan nota (${rp(sum(L,o=>o.nilai))}).</span><button class="btn sm pri" data-act="goTagih">Lihat &amp; buat tagihan</button></div>`};
A.goTagih=()=>{U.jobF='tagih';S.tab='job';render();window.scrollTo(0,0)};
A.mkNota=b=>{if(!canKas())return;const o=S.orders.find(x=>x.id===b.dataset.id),i=o&&notaOf(o);if(!o)return;if(i){toast(o.id+' sudah punya nota '+i.no);return}K=newK();S.tab='kas';loadJob(o.id);window.scrollTo(0,0);toast('Order '+o.id+' dimuat ke Kasir')};

/* ---------- Alasan wajib & log ---------- */
const okReason=v=>String(v||'').trim().length>=5;
function askReason(judul,info,cb){modal(`<h2 style="font-size:20px">${esc(judul)}</h2><div class="info">${esc(info)}</div><form id="mf" class="grid" style="gap:14px"><label class="f">Alasan (wajib diisi)<textarea id="rs" rows="3" required placeholder="Jelaskan alasannya, minimal 5 karakter"></textarea></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Kembali</button><button class="btn pri" type="submit">Konfirmasi</button></div></form>`,sh=>{$('#mf',sh).addEventListener('submit',e=>{e.preventDefault();const v=$('#rs',sh).value.trim();if(!okReason(v)){toast('Alasan wajib diisi (minimal 5 karakter)');return}closeModal();cb(v)})})}
function logAksi(aksi,ref,alasan){S.log=S.log||[];S.log.unshift({tgl:TODAY,jam:nowHM(),oleh:SES.nama,role:ROLE_L[SES.role],aksi,ref,alasan});S.log.length=Math.min(S.log.length,200)}
const _dO=A.delOrder;A.delOrder=b=>{const o=S.orders.find(x=>x.id===b.dataset.id);if(!o)return;askReason('Hapus order '+o.id,'Penghapusan order harus disertai alasan.',al=>{logAksi('Hapus order',o.id+' - '+o.nama,al);_dO(b)})};
const logCard=()=>{const L=(S.log||[]).slice(0,10);return `<div class="card"><h3>Log pembatalan, penolakan &amp; penghapusan</h3><div class="tw"><table><thead><tr><th>Waktu</th><th>Aksi</th><th>Data</th><th>Oleh</th><th>Alasan</th></tr></thead><tbody>${L.length?L.map(x=>`<tr><td>${fds(x.tgl)}<br><small>${x.jam}</small></td><td><b>${esc(x.aksi)}</b></td><td>${esc(x.ref)}</td><td>${esc(x.oleh)}<br><small>${esc(x.role)}</small></td><td>${esc(x.alasan)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada.</td></tr>'}</tbody></table></div></div>`};
const _apr=V.apr;V.apr=()=>_apr()+logCard();const _jur=V.jur;V.jur=()=>_jur()+logCard();
(function init(){S=load();if(!S||!S.set){S=seed();save()}mig();if(!V[S.tab])S.tab='dash';S.rem=S.rem||{};S.emps.forEach(e=>{if(!e.pw)e.pw='teknisi123'});SES=loadSes();if(SES&&SES.role==='internal'){SES.role='adminops';saveSes()}render()})();
</script>
